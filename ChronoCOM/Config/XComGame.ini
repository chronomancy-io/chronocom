; ========================================
; CHRONOCOM RUNTIME SWITCHES
; ========================================
[ChronoCOM.X2ChronoConfig]
; true = vanilla gameplay: every ChronoCOM change off (an A/B from the same save)
bBaselineMode=false
; false = vanilla's own passes for the known-enemy list and the overwatching-ally
; count (A/B for the unit index; the results are identical either way, only the
; work differs)
bUseTurnIndex=true
; per-call debug logs (AI decisions)
bVerboseLogging=false

; true = only the mission's first Lost reveal plays its reveal matinee; later Lost
; reveals keep everything else (scamper, cameras). Loading a save resets the
; count.
bLostRevealOnlyFirst=true

; true = the Lost's melee attack uses the default framing camera instead of its
; cinescript close-up on every swing
bTrimLostAttackCamera=true

; true = a pod decides each alien turn whether to press, hold, fall back or
; assault, and its units get directives: fall back then overwatch, throw a grenade
; at a covered target they cannot hit, hold, or go in against a squad on overwatch
; (tuning below under POD INTENT; the tree is in XComAI.ini)
bPodIntent=true
; true = while a pod presses, as many of its units per turn as its temperament
; allows (TEMPER_FLANKERS: 0, 1 or 2) move to flank: a tile
; that flanks an XCOM unit and is not itself flanked, taken only with both actions
; left and only when vanilla's own overwatch and suppression checks allow a move.
; A unit that already flanks someone keeps the shot instead of throwing a grenade
; or moving again. Needs bPodIntent. (The branch is in XComAI.ini.)
bFlankManeuver=true
; true = an alien's standard shot prefers the target the squad is already working
; on (tuning below under FOCUS FIRE AND COVER FLUSH)
bFocusFire=true
; true = within a pod, units holding a grenade act before the others
bGrenadiersFirst=true
; true = within a pod, units that already flank an enemy act next (they have the
; best shots, and the target they shoot is the one the rest pile onto)
bFlankersFirst=true
; true = when a pod starts to fall back, hold or assault, a member the squad can
; see shows a flyover ("Falling Back", "Holding Position", "Assaulting")
bIntentFlyover=true
; true = once the adaptive memory has detected the squad's habit (tier 1 or
; higher), the aliens counter it with vanilla's own tools: a different vanilla
; tile profile for their moves, a lower overwatch count to assault, a stronger
; spread penalty
; (tuning below under HABIT COUNTERS)
bAdaptiveCounter=true
; true = sound carries, and the aliens come to it. Vanilla alerts the enemies
; within a weapon's sound range (rifles 27 m, grenades 30 m at the blast, about
; the sight range), but only the ones you can see: a pod off screen never reacts
; to noise. With this on:
;   - every alien in earshot of your gunfire or explosions learns where the
;     shooter is and comes, seen or not, and from farther (tuning below under SOUND)
;   - a launched grenade is as loud as the grenade (vanilla's launcher is silent)
;   - aliens that are not in a fight yet hear their own side's gunfire and
;     grenades and come to the unit that is fighting
; Together with bHiveComms this is the main difficulty dial of the mod: every
; fight draws more pods.
bSoundPropagation=true
; true = instant comms. While any alien sees an XCOM unit, every member of every
; pod that sees no soldier is told where it is at the start of each alien turn,
; whatever its alert level, and its pod comes. (What the aliens know and can shoot
; at is bHonestKnowledge; this is what makes the other pods move.)
bHiveComms=true
; true = the aliens are a hivemind that knows what it sees: an alien acts on the
; XCOM units that ANY alien can see right now, instead of every unconcealed XCOM
; unit on the map (vanilla). One pod's sighting lets every pod move to a firing
; position. A unit no alien sees is hunted where it was last seen or heard
; (vanilla's alert data), so breaking every line of sight still works. Melee
; approach points and a few cover helpers still use vanilla's full list.
; false = vanilla.
bHonestKnowledge=true
; true = a pod that knows where the squad is but sees nobody (it was told about a
; fight, or it lost sight of the squad) dashes to the edge of the squad's reach
; (its temperament's TEMPER_EDGE_TILES, under POD INTENT), holds there, and goes in
; once a pod has held for its TEMPER_PATIENCE_TURNS; every waiting pod goes in on
; that turn.
; While any alien has a soldier in sight a told pod dashes straight in. Until
; 2026-10-04 a told pod dashed in every turn until it saw the squad. Off, a told pod
; walks: one move per turn toward the alert, 2 to 6 tiles (test mission,
; 2026-10-02), and a red pod that sees nobody waits outside the squad's
; overwatch. Needs bPodIntent.
bRushToAlerts=true
; true = on a defense mission (vanilla's job list for the mission type includes
; Defender: hacks, recovers, sabotage, relays, UFOs, rescues and the rest), the
; hive defends the mission's objective instead of hunting: a told pod pulls back to the objective
; (GUARD_RADIUS_TILES), holds it with up to GUARD_MAX_POD_OVERWATCH members on
; overwatch, never goes in, and with the squad in sight holds its ground. The
; squad has to come in under fire. Needs bRushToAlerts.
bGuardObjectives=true
; true = the hive remembers where the squad has hurt it: every reaction shot at an
; alien (overwatch, Long Watch) and every alien killed marks the spot, and for a
; few alien turns the aliens' moves score those spots lower, holds at the edge
; turn away from them, and pincer points avoid them (tuning below under DANGER
; MAP). The marks are saved with the mission.
bDangerMap=true
; true = pods going in together pick, on their side of the squad, a pincer point
; no soldier the hive knows of could see (the engine's own sight test), when one
; of three nearby points qualifies (PINCER_SWING_DEGREES, under POD INTENT)
bHiddenApproach=true
; true = alien moves weigh height: every tile search runs with vanilla's
; height-aware twin of its profile (HEIGHT_PROFILES, under HABIT COUNTERS)
bHeightAware=true

; ========================================
; SOUND (X2ChronoConfig.bSoundPropagation)
; ========================================
; How far a sound is heard = the weapon's own vanilla sound range x a scale.
; 1.0 = vanilla's range. 1 tile = 1.5 m; vanilla sight is 27 m (18 tiles).
[ChronoCOM.X2EventListener_ChronoNoise]
; A sound made at the shooter: gunfire. Rifles 27 m -> 40 m (27 tiles)
GUNFIRE_SOUND_SCALE=1.5
; A sound made where it lands: grenades and other explosives. 30 m -> 75 m (50 tiles)
EXPLOSION_SOUND_SCALE=2.5

; ========================================
; HIT CALCULATION
; ========================================
; The hit calculation is vanilla's: cover (20 half, 40 full), each weapon's own
; range table, the height advantage bonus (+20), flanking (each unit's own
; flanking aim and crit stats), ability flags, squadsight, dodge, effects, the
; crit fold, the roll and the difficulty aim assist (DefaultGameCore.ini: on
; Rookie, Veteran and Commander XCOM lands more than the displayed chance).
; ChronoCOM adds no term and changes none; it has no hit-calculation keys.

; ========================================
; POD INTENT
; ========================================
; A pod is engaged while any member sees XCOM (then investigating for 5 turns,
; then unaware). An engaged pod's intent for the turn comes from what its members
; see. Pods fight: they press by default, hold a position when pressing would be
; reckless, and fall back only when defeat is imminent. In this order:
;   fall back - defeat is imminent: the pod has lost members, is down to
;               FALLBACK_MAX_SURVIVORS or fewer, and sees
;               FALLBACK_ENEMIES_PER_SURVIVOR or more XCOM units per member left.
;               Once per mission: afterwards it holds
;   hold      - it is weakened (down to WEAKENED_STRENGTH_PERCENT of its starting
;               members or fewer and sees more XCOM units than it has members
;               left). Holding is fighting from where it stands: no advance,
;               shots and overwatch from cover
;   assault   - it sees HOLD_MIN_ENEMY_OVERWATCH or more XCOM units on overwatch,
;               or it sees nobody, is alerted (yellow or red) and knows where the
;               squad is, and either some other alien has a soldier in sight (a
;               fight is on), or it has held at the edge of the squad's reach for
;               its TEMPER_PATIENCE_TURNS, or another pod has (the
;               pods go in together).
;               Its member of the lowest rank (BAIT_ORDER) goes in first, into the open, to draw
;               the overwatch; the others move to flanking tiles (within one
;               move and shoot, else within a dash), or charge
;   press     - otherwise: advance, flank, shoot
; Until 2026-10-01 a weakened pod fell back; in missions 11 and 12 that made fall
; back the commonest intent (4 pod-turns against 2 of press) and the aliens took
; four shots in two missions.
[ChronoCOM.X2PodCoordinator_Optimized]
FALLBACK_MAX_SURVIVORS=1
FALLBACK_ENEMIES_PER_SURVIVOR=3
WEAKENED_STRENGTH_PERCENT=50
HOLD_MIN_ENEMY_OVERWATCH=2
; Members of one pod allowed on overwatch at the same time while holding or
; falling back
HOLD_MAX_POD_OVERWATCH=2
; While a pod holds, none of its ranged, cover-using units starts a move with an
; advancing tile profile (retreats and melee moves are still allowed); their own
; trees then use what they can do from where they stand. The character groups
; listed here additionally take the directed tree's hold branch (relocate if
; flanked, grenade two or more, shoot at 50% or better, else overwatch under the
; cap, else shoot). It replaces the character's own first choices, so list only
; groups with no special abilities to lose.
+HOLD_LINE_GROUPS=AdventTrooper
; Against a squad whose habit is the overwatch crawl, HOLD_MIN_ENEMY_OVERWATCH is
; lowered by this times the counter's strength, rounded (never below 1; strength
; under ADAPTIVE MEMORY)
HABIT_OVERWATCH_HOLD_REDUCTION=1
; Temperament: every pod rolls one of three when it is created, so pods do not
; all play alike. Each list has three entries: cautious, steady, eager.
; TEMPER_ODDS weighs the roll (3:2:1, half the pods cautious; until 2026-10-05
; the three were equally likely)
+TEMPER_ODDS=3
+TEMPER_ODDS=2
+TEMPER_ODDS=1
;
; An alerted pod that sees nobody (bRushToAlerts), while no alien anywhere has a
; soldier in sight at the turn's update: a member farther than TEMPER_EDGE_TILES
; from where the pod believes the squad is dashes to that distance and stops;
; inside it, it holds: no step closer, into cover against that position if it
; has none (within one move), reload, overwatch under HOLD_MAX_POD_OVERWATCH,
; else wait. If some alien does have a soldier in sight the pod assaults at
; once. A soldier's sight range is 18 tiles (27 m); 24 keeps a holding pod out
; of the sight of soldiers standing nearer than the one the pod believes in.
; Until 2026-10-03 the edge was 18, and a pod that stopped there was seen and
; drew four overwatch shots (test mission launch 10). Keep every entry at 24 or
; more.
+TEMPER_EDGE_TILES=30
+TEMPER_EDGE_TILES=26
+TEMPER_EDGE_TILES=24
; Alien turns a pod holds at the edge without seeing the squad before it
; assaults the believed position (bait first, then flankers; a pod that has not
; been revealed moves as one group behind its leader). Only turns it starts with
; a member inside the edge count; turns spent closing do not. When one pod goes
; in, every other pod that knows where the squad is goes in on the same turn.
; 0 = assault on the first turn at the edge
+TEMPER_PATIENCE_TURNS=3
+TEMPER_PATIENCE_TURNS=2
+TEMPER_PATIENCE_TURNS=1
; Units of a pressing pod that may move to a flanking tile in one alien turn
; (bFlankManeuver). Until 2026-10-05 every pod sent one
+TEMPER_FLANKERS=0
+TEMPER_FLANKERS=1
+TEMPER_FLANKERS=2
; Pods going in on the same turn without sight of the squad split: each swings
; this many tiles to the side of the believed position away from the others
PINCER_OFFSET_TILES=8
; When the squad could see that point, or it lies where the squad has hurt the
; hive, the pod tries it turned this far toward and away from the squad's line
; (bHiddenApproach, bDangerMap)
PINCER_SWING_DEGREES=30
; All in: missions (by MissionName) on which no pod holds back. Told where the
; squad is, a pod goes in at once instead of waiting at the edge, and in contact
; it presses: it neither holds nor falls back. The compound rescue (Rescue
; Operative) is here because its security alarm tells every alien where the
; squad is at once; with the hunt's patience every pod then waited on overwatch
+ALL_IN_MISSIONS=CompoundRescueOperative
; Guarding (bGuardObjectives): a guarding pod pulls back to within this many
; tiles of the objective and holds there
GUARD_RADIUS_TILES=6
; Members of a guarding pod allowed on overwatch at once (until 2026-10-05 a
; whole pod, 3)
GUARD_MAX_POD_OVERWATCH=2
; Who goes in first when a pod assaults: the living member whose character group
; comes earliest in this list (the grunts), then by health among equals. Groups
; not listed are chosen only when no listed member lives. Shield bearers and
; priests come late so they keep their shields and buffs for the others.
+BAIT_ORDER=AdventTrooper
+BAIT_ORDER=AdventStunLancer
+BAIT_ORDER=AdventPurifier
+BAIT_ORDER=AdventTurret
+BAIT_ORDER=Sectoid
+BAIT_ORDER=Viper
+BAIT_ORDER=Faceless
+BAIT_ORDER=Chryssalid
+BAIT_ORDER=Muton
+BAIT_ORDER=Berserker
+BAIT_ORDER=AdventMEC
+BAIT_ORDER=Archon
+BAIT_ORDER=Spectre
+BAIT_ORDER=Andromedon
+BAIT_ORDER=AdventCaptain
+BAIT_ORDER=AdventShieldBearer
+BAIT_ORDER=AdventPriest
+BAIT_ORDER=Cyberus
+BAIT_ORDER=Sectopod
+BAIT_ORDER=Gatekeeper
+BAIT_ORDER=AdventPsiWitch

; ========================================
; FOCUS FIRE AND COVER FLUSH
; ========================================
[ChronoCOM.X2AIBehaviorDirector_Optimized]
; Points added to the score of an alien's standard-shot target. Vanilla's own
; terms for scale: hit chance below 40% scores 10, 80% or more 70, otherwise 40;
; flanked +50; marked +45; kill shot +15.
; Linear in hit chance: FOCUS_HIT_WEIGHT at 100%
FOCUS_HIT_WEIGHT=30
; Per earlier attack on the target this alien turn, counting at most FOCUS_PILE_ON_MAX
FOCUS_PILE_ON_BONUS=15
FOCUS_PILE_ON_MAX=2
; The target's cover was grenaded this turn
FOCUS_FLUSHED_BONUS=25
; The target is the hive's focus target: one soldier, the one with the least
; health in any alien's sight and not in smoke when it is chosen, kept until it
; is down, in smoke or no alien sees it. Every alien that can shoot it prefers
; it. 40 is more than vanilla's step from its middle hit-chance tier to its top
; one (40 to 70) and less than its flank bonus (50): a flanked soldier elsewhere
; still draws the shot. Until 2026-10-05 this was 60
FOCUS_TARGET_BONUS=40
; A unit throws its grenade at a covered XCOM unit when its own shot at that unit
; is below this chance (one flush grenade per target per alien turn)
FLUSH_MAX_HIT_CHANCE=50

; HABIT COUNTERS (X2ChronoConfig.bAdaptiveCounter). While the squad's detected
; habit is Pattern, an alien destination search asked for with vanilla tile
; profile FromProfile runs with vanilla profile ToProfile (DefaultAI.ini
; m_arrMoveWeightProfile). Patterns: PATTERN_CLOSE_RANGE, PATTERN_MEDIUM_RANGE,
; PATTERN_LONG_RANGE, PATTERN_ELEVATION_DEPENDENT, PATTERN_FLANKING_AGGRESSIVE,
; PATTERN_OVERWATCH_CRAWL, PATTERN_EXPLOSIVE_HEAVY.
; A squad that kills by flanking: advance cover to cover, not aggressively
+HABIT_PROFILE_COUNTERS=(Pattern=PATTERN_FLANKING_AGGRESSIVE, FromProfile=MWP_Aggressive, ToProfile=MWP_AdvanceCover)
; A squad that kills from high ground: weigh height too
+HABIT_PROFILE_COUNTERS=(Pattern=PATTERN_ELEVATION_DEPENDENT, FromProfile=MWP_Standard, ToProfile=MWP_StandardHeight)
+HABIT_PROFILE_COUNTERS=(Pattern=PATTERN_ELEVATION_DEPENDENT, FromProfile=MWP_AdvanceCover, ToProfile=MWP_AdvanceCoverHeight)
; A squad that kills at long range: close the distance
+HABIT_PROFILE_COUNTERS=(Pattern=PATTERN_LONG_RANGE, FromProfile=MWP_Standard, ToProfile=MWP_Aggressive)
; A squad that kills at close range: do not run in
+HABIT_PROFILE_COUNTERS=(Pattern=PATTERN_CLOSE_RANGE, FromProfile=MWP_Aggressive, ToProfile=MWP_Standard)
; A grenade-heavy squad (PATTERN_EXPLOSIVE_HEAVY): vanilla's score multiplier for
; a tile within spread distance of a teammate is multiplied by this raised to the
; counter's strength (0.5 at strength 1; 0.35 at 1.5; 0.25 at 2)
HABIT_SPREAD_SCALE=0.5

; HEIGHT (X2ChronoConfig.bHeightAware). Every alien tile search asked for with
; FromProfile runs with vanilla's height-aware twin ToProfile (DefaultAI.ini),
; after any habit counter above. Each twin adds the tile's height to the score
; (fHeightWeight 1.0); vanilla also tunes two of them differently:
;   MWP_StandardHeight      tiles nearer than the ideal range count double and
;                           farther ones half (fCloseModifier 2.0, fFarModifier
;                           0.5; MWP_Standard has 1.0 and 1.0)
;   MWP_AdvanceCoverHeight  no score for seeing one enemy or for seeing allies
;                           (fEnemyVisWeightPeak1 0, fAllyVisWeight 0; 1.5 and 1.0)
;   MWP_DefensiveHeight, MWP_FallbackHeight: otherwise the same profile
+HEIGHT_PROFILES=(FromProfile=MWP_Standard, ToProfile=MWP_StandardHeight)
+HEIGHT_PROFILES=(FromProfile=MWP_AdvanceCover, ToProfile=MWP_AdvanceCoverHeight)
+HEIGHT_PROFILES=(FromProfile=MWP_Defensive, ToProfile=MWP_DefensiveHeight)
+HEIGHT_PROFILES=(FromProfile=MWP_Fallback, ToProfile=MWP_FallbackHeight)

; ========================================
; ADAPTIVE MEMORY (cross-mission learning)
; ========================================
; Campaign-scoped sufficient statistics of how XCOM fights, counted from real
; events each mission and decayed per mission. All keys are read by code.
[ChronoCOM.XComGameState_AdaptiveMemory]
; The habit is judged every alien turn on the decayed totals plus the mission so
; far, so it can be countered in the first mission. The tiers only set how hard:
; missions until the counter's strength steps from 0.5 to 1.0 / 1.5 / 2.0
; (CounterTierStep, below; Veteran)
MissionsUntilTier1=3
MissionsUntilTier2=6
MissionsUntilTier3=10
; Every total is multiplied by this before a mission is added (recent play weighs more)
MemoryDecay=0.8
; Kills needed before any pattern is detected: decayed, plus the mission so far
; (until 2026-10-06 15, decayed only, from tier 1 on)
MinKillsForPatternDetection=5.0
; Share thresholds (of decayed kills, or of shots for overwatch activations)
PatternDetectionThreshold=0.6
ElevationPatternShare=0.5
FlankPatternShare=0.5
OverwatchPatternShare=0.4
ExplosivePatternShare=0.4
; Range buckets (tiles) and the tile-Z difference that counts as high ground
CloseRangeMaxTiles=6
MediumRangeMaxTiles=15
HighGroundTileZ=2
; How hard the aliens counter the detected habit: CounterWeightMultiplier, times
; the campaign difficulty's multiplier below when bScaleWithDifficulty, times 1.0
; at tier 1 plus CounterTierStep for each tier past it. Veteran: 1.0 / 1.5 / 2.0
; at tiers 1 / 2 / 3; Legendary: 1.5 / 2.25 / 3.0. The spread penalty and the
; overwatch threshold (HABIT COUNTERS, POD INTENT) scale with it; the profile
; swaps are on whenever a habit is detected.
CounterWeightMultiplier=1.0
CounterTierStep=0.5
bScaleWithDifficulty=true
RookieMultiplier=0.75
VeteranMultiplier=1.0
CommanderMultiplier=1.25
LegendaryMultiplier=1.5

[ChronoCOM.X2AdaptiveCollector]
; Activations that count as overwatch use
+OverwatchAbilityNames=Overwatch
+OverwatchAbilityNames=PistolOverwatch
+OverwatchAbilityNames=SniperRifleOverwatch
+OverwatchAbilityNames=LongWatch
+OverwatchAbilityNames=Killzone
+OverwatchAbilityNames=KillZone
; Activations that count as grenade use (grenade items are detected by template as well)
+GrenadeAbilityNames=ThrowGrenade
+GrenadeAbilityNames=LaunchGrenade
; Kills with these weapon categories count as explosive
+ExplosiveWeaponCategories=grenade
+ExplosiveWeaponCategories=grenade_launcher
; Count kills of The Lost as well as alien-team units
bCountLostKills=false

; ========================================
; COMMS JAMMING (X2Ability_ChronoSupport; the retired item, X2Item_ChronoSupport)
; ========================================
; Comms jamming: vanilla's EMP grenade and EMP Bomb also jam every enemy in
; their radius, organic or not, until the start of the squad's turn JAM_TURNS
; on (until 2026-10-05 a separate starting item, the comms jammer, did this): the hive cannot tell it anything, and what it sees does not
; reach the hive (so other pods do not learn of soldiers only it sees, and the
; hive's focus target is not chosen from them). It still fights what it sees.
[ChronoCOM.X2Item_ChronoSupport]
JAMMER_RANGE_TILES=12
JAMMER_RADIUS_TILES=6

[ChronoCOM.X2Ability_ChronoSupport]
JAM_TURNS=1

; ========================================
; DANGER MAP (X2ChronoConfig.bDangerMap, X2ChronoDanger)
; ========================================
; The map is divided into DANGER_CELL_TILES x DANGER_CELL_TILES cells. A reaction
; shot by the squad at an alien adds DANGER_REACTION_WEIGHT to the cell the alien
; stood in, hit or miss; an alien killed by the squad adds DANGER_DEATH_WEIGHT to
; the cell it died in. A cell with no new mark for DANGER_TURNS alien turns is
; forgotten (the squad has moved on). While it is remembered:
;   - an alien's tile score there is divided by 1 + DANGER_TILE_PENALTY x the
;     cell's weight (positive scores only, as vanilla's own spread penalty)
;   - a hold at the edge whose point lies there turns by DANGER_SWING_DEGREES,
;     up to twice either way, to the safest bearing
;   - a pincer point there tries its turned alternatives (PINCER_SWING_DEGREES)
[ChronoCOM.X2ChronoDanger]
DANGER_CELL_TILES=4
DANGER_REACTION_WEIGHT=1
DANGER_DEATH_WEIGHT=2
DANGER_TURNS=3
DANGER_TILE_PENALTY=0.5
DANGER_SWING_DEGREES=25
