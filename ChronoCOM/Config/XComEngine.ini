; ========================================
; ChronoCOM - Engine Configuration
; ========================================

[Engine.ScriptPackages]
; Register ChronoCOM as a script package
+NonNativePackages=ChronoCOM

; ========================================
; MOD CLASS OVERRIDES
; ========================================
; ChronoCOM uses ModClassOverride for maximum compatibility
; This allows the mod to work alongside other mods that don't
; directly modify the same classes

[Engine.Engine]
; AI Behavior System
; Both fields are name-typed and matched against bare class names: a package
; prefix ("XComGame.XGAIBehavior") never matches and the override silently
; does nothing. The engine's override table is logged at startup
; ("ChronoCOM: ModClassOverride[...]") so this can be checked in Launch.log.
+ModClassOverrides=(BaseGameClass="XGAIBehavior",ModClass="XGAIBehavior_ChronoCOM")
; The alien player: within a pod, units holding a grenade act first
; (X2ChronoConfig.bGrenadiersFirst, see XGAIPlayer_ChronoCOM)
+ModClassOverrides=(BaseGameClass="XGAIPlayer",ModClass="XGAIPlayer_ChronoCOM")
; The Lost decide as a group in their player class, not through the behavior
; tree; this override bounds and times those group moves (see XGAIPlayer_TheLost_ChronoCOM)
+ModClassOverrides=(BaseGameClass="XGAIPlayer_TheLost",ModClass="XGAIPlayer_TheLost_ChronoCOM")
; Pod reveal visualization: only the mission's first Lost reveal plays its
; matinee and swarm camera (X2ChronoConfig.bLostRevealOnlyFirst)
+ModClassOverrides=(BaseGameClass="X2Action_RevealAIBegin",ModClass="X2Action_RevealAIBegin_ChronoCOM")

; Note: ChronoCOM installs no hit calculator; hit chances are vanilla's.
