; ========================================
; NO LIMIT ON THE FIGHT
; ========================================
; Vanilla keeps most of the alien force out of any one fight:
;   - DownThrottleUnitCount (vanilla 4): once this many aliens are engaged, the
;     "fight manager" drops every sound and call-for-help alert and steers the pods
;     that are not engaged AWAY from the fight
;   - MaxEngagedEnemies (vanilla 4 Rookie, 6 Veteran and Commander, 99 Legend): once
;     this many aliens have attacked in a turn, the rest only reposition or overwatch
; ChronoCOM lifts both: a hivemind commits everything it has. These are plain ini
; overrides, so X2ChronoConfig.bBaselineMode does not restore them; for a vanilla
; comparison comment the five lines out. The startup self-test logs the values
; the game loaded ("vanilla fight limits").
[XComGame.XComGameState_AIPlayerData]
DownThrottleUnitCount=999
MaxEngagedEnemies[0]=-1
MaxEngagedEnemies[1]=-1
MaxEngagedEnemies[2]=-1
MaxEngagedEnemies[3]=-1

; ========================================
; POD INTENT: the directed behavior tree
; ========================================
; XGAIBehavior_ChronoCOM runs ChronoRoot instead of GenericAIRoot for alien units on
; the default tree (X2ChronoConfig.bPodIntent). ChronoRoot is GenericAIRoot with one
; branch, ChronoDirected, in front of the character's own tree. The branch reads
; behavior-tree variables the script sets before each run:
;   ChronoDirective   1 = fall back, 2 = flush cover with a grenade, 4 = move to
;                     flank, 5 = bait (the pod assaults; this unit goes in first),
;                     6 = assault (flank if a tile is in reach, else charge),
;                     0 or 3 = none of these
;   ChronoHold        1 = the unit's pod holds this turn and the unit is line infantry
;                     (XComGame.ini HOLD_LINE_GROUPS)
;   ChronoOverwatch   1 = the pod is under its overwatch cap
;   ChronoRush        1 = the unit dashes toward where the hive believes the squad is,
;                     or, for a pod guarding an objective, back to the objective:
;                     it is alerted, its pod sees nobody and it is still outside the
;                     edge (it stops there), or its pod goes in and it is on yellow
;                     alert (X2ChronoConfig.bRushToAlerts; XComGame.ini TEMPER_EDGE_TILES)
;   ChronoSetUp       1 = the unit is alerted (yellow or red), its pod sees nobody and
;                     is not going in, and it is at the edge: it holds; 2 = it first
;                     moves to cover
; The script sets the destination of a rush, a bait move, a charge and a move into
; cover after the run (XGAIBehavior_ChronoCOM.SteerMove); the tree only selects the
; move.
; With none of them set every ChronoDirected branch fails and the tree continues
; into "::CharacterRoot" exactly as GenericAIRoot does. Every node name below is
; new; no vanilla node is redefined. All leaves are vanilla's.
[XComGame.X2AIBTBehaviorTree]
+Behaviors=(BehaviorName=ChronoRoot, NodeType=Selector, Child[0]=TryNonAggressiveBehavior, Child[1]=TryMindControlledRoot, Child[2]=ChronoRush, Child[3]=ChronoSetUp, Child[4]=ChronoDirected, Child[5]="::CharacterRoot", Child[6]=SkipMove)
+Behaviors=(BehaviorName=ChronoDirected, NodeType=Sequence, Child[0]=IsRedAlert, Child[1]=ChronoDirectiveSelector)
+Behaviors=(BehaviorName=ChronoDirectiveSelector, NodeType=Selector, Child[0]=ChronoFallBack, Child[1]=ChronoBait, Child[2]=ChronoFlush, Child[3]=ChronoAssault, Child[4]=ChronoFlank, Child[5]=ChronoHold)

+Behaviors=(BehaviorName=ChronoIsFallBack, NodeType=StatCondition, Param[0]=BTVar, Param[1]="==", Param[2]="1", Param[3]="ChronoDirective")
+Behaviors=(BehaviorName=ChronoIsFlush, NodeType=StatCondition, Param[0]=BTVar, Param[1]="==", Param[2]="2", Param[3]="ChronoDirective")
+Behaviors=(BehaviorName=ChronoIsFlank, NodeType=StatCondition, Param[0]=BTVar, Param[1]="==", Param[2]="4", Param[3]="ChronoDirective")
+Behaviors=(BehaviorName=ChronoIsBait, NodeType=StatCondition, Param[0]=BTVar, Param[1]="==", Param[2]="5", Param[3]="ChronoDirective")
+Behaviors=(BehaviorName=ChronoIsAssault, NodeType=StatCondition, Param[0]=BTVar, Param[1]="==", Param[2]="6", Param[3]="ChronoDirective")
+Behaviors=(BehaviorName=ChronoIsHold, NodeType=StatCondition, Param[0]=BTVar, Param[1]="==", Param[2]="1", Param[3]="ChronoHold")
+Behaviors=(BehaviorName=ChronoMayOverwatch, NodeType=StatCondition, Param[0]=BTVar, Param[1]="==", Param[2]="1", Param[3]="ChronoOverwatch")
+Behaviors=(BehaviorName=ChronoIsRush, NodeType=StatCondition, Param[0]=BTVar, Param[1]="==", Param[2]="1", Param[3]="ChronoRush")
+Behaviors=(BehaviorName=ChronoIsSetUp, NodeType=StatCondition, Param[0]=BTVar, Param[1]=">=", Param[2]="1", Param[3]="ChronoSetUp")
+Behaviors=(BehaviorName=ChronoTakesCover, NodeType=StatCondition, Param[0]=BTVar, Param[1]="==", Param[2]="2", Param[3]="ChronoSetUp")

; Rush: the unit takes vanilla's own alert-data move (its best alert datum,
; selected and scored by vanilla's nodes) with dashing allowed, so a pod closes at
; two moves a turn. The script sets ChronoRush only for an alerted unit whose pod
; sees nobody and which is still outside the edge, or a yellow unit whose pod goes
; in; a red unit with a soldier in sight never enters this branch. A priority target is
; still attacked first, as in vanilla's TrySelectYellowAlertAction.
+Behaviors=(BehaviorName=ChronoRush, NodeType=Sequence, Child[0]=ChronoIsRush, Child[1]=ChronoRushAction)
+Behaviors=(BehaviorName=ChronoRushAction, NodeType=Selector, Child[0]=TryAttackPriorityTarget, Child[1]=ChronoRushMove)
+Behaviors=(BehaviorName=ChronoRushMove, NodeType=Sequence, Child[0]=NotLastActionPoint, Child[1]=IsAbilityAvailable-StandardMove, Child[2]=SelectAbility-StandardMove)

; Set up: the hold at the edge. An alerted unit whose pod sees nobody and is not
; assaulting does not advance once it is inside the edge, and its own tree does
; not run (vanilla's red-alert hunting would walk it at the squad). With both actions left and no
; cover against where the squad is believed to be, it moves to the cover tile
; the script found (within one move, no nearer to that position). Then it
; reloads an empty weapon (vanilla's node), goes on overwatch while its pod is
; under the cap, or waits. The pod's patience ends it (TEMPER_PATIENCE_TURNS); a guarding pod
; holds until it sees the squad (bGuardObjectives).
+Behaviors=(BehaviorName=ChronoSetUp, NodeType=Sequence, Child[0]=ChronoIsSetUp, Child[1]=ChronoSetUpAction)
+Behaviors=(BehaviorName=ChronoSetUpAction, NodeType=Selector, Child[0]=ChronoSetUpCover, Child[1]=NeedsReload, Child[2]=ChronoOverwatchIfAllowed, Child[3]=SkipMove)
+Behaviors=(BehaviorName=ChronoSetUpCover, NodeType=Sequence, Child[0]=ChronoTakesCover, Child[1]=NotLastActionPoint, Child[2]=IsAbilityAvailable-StandardMove, Child[3]=SelectAbility-StandardMove)

; Assault. The pod's bait (its member of the lowest rank, BAIT_ORDER, which the
; player class moves first) dashes toward where the squad is believed to be, into whatever is
; waiting; the script sets its destination. The others flank: a flanking tile
; within one move (vanilla's flanking restriction and profile; the unit's own
; tree then shoots), else a flanking tile within a dash, else a charge toward the
; squad with the destination set by the script. None of these asks SafeToMove:
; walking into overwatch is the point. With the last action point the branch
; fails and the unit's own tree shoots.
+Behaviors=(BehaviorName=ChronoBait, NodeType=Sequence, Child[0]=ChronoIsBait, Child[1]=NotLastActionPoint, Child[2]=IsAbilityAvailable-StandardMove, Child[3]=SelectAbility-StandardMove)
+Behaviors=(BehaviorName=ChronoAssault, NodeType=Sequence, Child[0]=ChronoIsAssault, Child[1]=NotLastActionPoint, Child[2]=IsAbilityAvailable-StandardMove, Child[3]=ChronoAssaultMove)
+Behaviors=(BehaviorName=ChronoAssaultMove, NodeType=Selector, Child[0]=ChronoAssaultFlankNear, Child[1]=ChronoAssaultFlankDash, Child[2]=ChronoAssaultCharge)
+Behaviors=(BehaviorName=ChronoAssaultFlankNear, NodeType=Sequence, Child[0]=ResetDestinationSearch, Child[1]=RestrictToFlanking, Child[2]=RestrictToUnflanked, Child[3]=FindRestrictedDestination-MWP_Flanking, Child[4]=SelectAbility-StandardMove)
+Behaviors=(BehaviorName=ChronoAssaultFlankDash, NodeType=Sequence, Child[0]=ResetDestinationSearch, Child[1]=UseDashMovement, Child[2]=RestrictToFlanking, Child[3]=FindRestrictedDestination-MWP_Flanking, Child[4]=SelectAbility-StandardMove)
+Behaviors=(BehaviorName=ChronoAssaultCharge, NodeType=Sequence, Child[0]=ResetDestinationSearch, Child[1]=SelectAbility-StandardMove)

; Fall back: with both actions left, vanilla's own retreat move (defensive or
; fallback tile profile, refused when moving would run through overwatch); then
; overwatch while the pod is under its cap; otherwise shoot. If none applies the
; unit's own tree decides.
+Behaviors=(BehaviorName=ChronoFallBack, NodeType=Sequence, Child[0]=ChronoIsFallBack, Child[1]=ChronoFallBackAction)
+Behaviors=(BehaviorName=ChronoFallBackAction, NodeType=Selector, Child[0]=FallBackIfFirstAbility, Child[1]=ChronoOverwatchIfAllowed, Child[2]=ShootIfAvailable)

; Flush: the grenade goes where it hits the unit the script chose (the profile's
; required target) and as many others as possible, never an ally or an objective.
; Out of range or no clean throw: the branch fails and the next one is tried.
+Behaviors=(BehaviorName=ChronoFlush, NodeType=Sequence, Child[0]=ChronoIsFlush, Child[1]=IsAbilityAvailable-ThrowGrenade, Child[2]=FindPotentialAoETargets-ChronoFlushProfile, Child[3]=SelectAoETarget-ChronoFlushProfile, Child[4]=SelectAbility-ThrowGrenade)
+Behaviors=(BehaviorName=FindPotentialAoETargets-ChronoFlushProfile, NodeType=Action)
+Behaviors=(BehaviorName=SelectAoETarget-ChronoFlushProfile, NodeType=Action)

; Flank (X2ChronoConfig.bFlankManeuver; per pressing pod per turn, as many units
; as its temperament allows, TEMPER_FLANKERS): with
; both actions left, and only when vanilla's own checks call moving safe (its
; rolls against overwatch and suppression), move to a tile that flanks a known
; enemy and is not itself flanked, scored with vanilla's flanking tile profile.
; The second action is then the unit's own tree, which shoots the flanked target.
; No such tile in reach: the search is reset and the branch fails, so the unit's
; own tree decides as if the branch were not there.
+Behaviors=(BehaviorName=ChronoFlank, NodeType=Sequence, Child[0]=ChronoIsFlank, Child[1]=NotLastActionPoint, Child[2]=SafeToMove, Child[3]=IsAbilityAvailable-StandardMove, Child[4]=ChronoFlankMove)
+Behaviors=(BehaviorName=ChronoFlankMove, NodeType=Selector, Child[0]=ChronoFlankSearch, Child[1]=ChronoFlankGiveUp)
+Behaviors=(BehaviorName=ChronoFlankSearch, NodeType=Sequence, Child[0]=ResetDestinationSearch, Child[1]=RestrictToFlanking, Child[2]=RestrictToUnflanked, Child[3]=FindRestrictedDestination-MWP_Flanking, Child[4]=SelectAbility-StandardMove)
+Behaviors=(BehaviorName=ChronoFlankGiveUp, NodeType=Inverter, Child[0]=ResetDestinationSearch)

; Hold (line infantry): a flanked unit still relocates (vanilla's flanked move,
; whose advancing options the script refuses, leaving its retreat); then vanilla's
; grenade at two or more; then a shot of 50% or better; else overwatch while the
; pod is under its cap; else the shot there is. No advance into waiting overwatch.
+Behaviors=(BehaviorName=ChronoHold, NodeType=Sequence, Child[0]=ChronoIsHold, Child[1]=ChronoHoldAction)
+Behaviors=(BehaviorName=ChronoHoldAction, NodeType=Selector, Child[0]=DoIfFlankedMove, Child[1]=TryGrenade, Child[2]=ChronoShootIfDecent, Child[3]=ChronoOverwatchIfAllowed, Child[4]=ShootIfAvailable)
+Behaviors=(BehaviorName=ChronoShootIfDecent, NodeType=Sequence, Child[0]=ChronoHasDecentShot, Child[1]=ShootIfAvailable)
+Behaviors=(BehaviorName=ChronoHasDecentShot, NodeType=StatCondition, Param[0]=TopHitChance, Param[1]=">=", Param[2]="50")
+Behaviors=(BehaviorName=ChronoOverwatchIfAllowed, NodeType=Sequence, Child[0]=ChronoMayOverwatch, Child[1]=TryOverwatch)

; The flush grenade's targeting profile: one target is enough, and it must be
; the unit the script chose (the 'Potential' target)
[XComGame.XGAIBehavior]
+AoEProfiles=(Profile=ChronoFlushProfile, Ability=ThrowGrenade, bUsePrecomputePath=1, bFailOnFriendlyFire=1, MinTargets=1, bRequirePotentialTarget=1)
